name: Code Standards

# Mechanical enforcement of the repo's layering and code standards.
# These are FAILING gates, not advisory: a rule nobody has seen fail is a rule
# nobody knows is wired up.

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # dependency-cruiser needs the TypeScript compiler present or it silently
      # cruises 0 modules and passes on a completely broken graph.
      - name: Guard against a false pass
        run: |
          node -e "require.resolve('typescript')" 2>/dev/null || {
            echo "::error::typescript is not installed. dependency-cruiser will report 0 modules and pass on a broken graph. Run: npm i -D typescript"
            exit 1
          }

      - name: Layer direction and public-API rules
        run: npm run depcruise

      - name: Typecheck (server and client)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the viewer
        run: npm run build

      # Which components changed in this pull request, and did their versions move? Warns until config/release.json
      # sets enforce.
      - name: Version check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run version:check -- --base "origin/$BASE_REF"

  # Draws a few small states and compares their fingerprints with tests/fingerprints/engine.json: the map may only
  # change when the engine major version does. Passes vacuously while the base's file records no states.
  fixture-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # Full history: the gate compares against the base branch (pull request) or the previous commit (push to main).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw
          key: census-${{ hashFiles('config/census-sha256.json') }}

      - name: Install
        run: npm ci

      # Compared against the BASE branch's tests/fingerprints/engine.json, never the pull request's own copy.
      - name: Fixture fingerprints
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            npm run fingerprints -- --check --base "origin/$BASE_REF"
          elif git rev-parse --verify --quiet "HEAD^" > /dev/null; then
            npm run fingerprints -- --check --base "HEAD^"
          else
            echo "::notice::Root commit: there is no base to compare the fixture fingerprints with."
          fi
