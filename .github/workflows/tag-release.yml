name: Tag release

# After a merge to main, tags every component whose version changed in config/versions.json (engine-v1.0.0,
# input-census-2020-r1, maps-1, schema-v1.0.0, web-v1.0.0, docs-v1.0.0). The push's "before" commit is the baseline.
# A true root commit (or a forced push whose before commit is gone or not an ancestor, with no parent) tags all six; a before commit
# without config/versions.json, or a config/release.json that does not enforce, tags nothing.
#
# Two jobs, so that no code from a dependency ever runs holding a token that can write:
#   plan  runs npm with a read-only token and writes the tag names to a one-line-per-tag text file.
#   tag   holds the write token and runs no npm or repository script. It treats the file as untrusted data: it is
#         downloaded outside the workspace, every line is matched against the exact tag shapes in plain bash, and only
#         then is a lightweight tag created and pushed. A tag that already exists on the remote at this commit is skipped; at a different commit the job fails.

on:
  push:
    branches: [main]

# One group per pushed commit: a shared group would drop a queued run when a newer push arrives, and that run's
# range (before..after) would then never be tagged. Runs cover disjoint ranges and the tag job skips existing tags.
concurrency:
  group: tag-release-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_tags: ${{ steps.plan.outputs.has_tags }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Work out the tags
        id: plan
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          before="$EVENT_BEFORE"
          # Usable only when it is a real commit and an ancestor of HEAD: after a force update the old tip can still exist
          # in the clone without being part of this history.
          if ! [[ "$before" =~ ^[0-9a-f]{40}$ ]] || [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}" 2> /dev/null || ! git merge-base --is-ancestor "$before" HEAD 2> /dev/null; then
            before=$(git rev-parse --verify --quiet "HEAD^" || echo none)
          fi
          echo "Comparing $before with $GITHUB_SHA"
          npm run -s release:tags -- --before "$before" --after "$GITHUB_SHA" > "$RUNNER_TEMP/tags.txt"
          cat "$RUNNER_TEMP/tags.txt"
          if [ -s "$RUNNER_TEMP/tags.txt" ]; then
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
            echo "No component changed version. Nothing to tag."
          fi

      - name: Hand over the tag names
        if: steps.plan.outputs.has_tags == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-tags
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/tags.txt

  tag:
    needs: plan
    if: needs.plan.outputs.has_tags == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Outside the workspace, so nothing in it can land on .git/ or a tracked path before it has been checked.
      - uses: actions/download-artifact@v4
        with:
          name: release-tags
          path: ${{ runner.temp }}/release-tags

      - name: Check the tag names and push the new tags
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ runner.temp }}/release-tags
        run: |
          set -euo pipefail
          file="$ARTIFACT/tags.txt"
          if [ -L "$file" ] || ! [ -f "$file" ]; then
            echo "::error::The artifact is not a regular tags.txt."
            exit 1
          fi
          if [ "$(find "$ARTIFACT" -mindepth 1 | grep -c .)" != "1" ]; then
            echo "::error::The artifact holds more than tags.txt."
            exit 1
          fi
          re='^(engine|schema|web|docs)-v[0-9]+\.[0-9]+\.[0-9]+$|^input-census-[0-9]{4}-r[0-9]+$|^maps-[0-9]+$'
          tags=()
          while IFS= read -r tag || [ -n "$tag" ]; do
            if [ -z "$tag" ]; then
              continue
            fi
            if ! [[ "$tag" =~ $re ]]; then
              echo "::error::Unexpected tag name: $tag"
              exit 1
            fi
            tags+=("$tag")
          done < "$file"
          if [ "${#tags[@]}" -eq 0 ] || [ "${#tags[@]}" -gt 6 ]; then
            echo "::error::Expected between 1 and 6 tags, got ${#tags[@]}."
            exit 1
          fi
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for tag in "${tags[@]}"; do
            remote=$(git -c "http.https://github.com/.extraheader=$AUTH" ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END { print $1 }')
            if [ -n "$remote" ]; then
              if [ "$remote" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already exists on the remote at $remote, not at $GITHUB_SHA. Tags are never moved; fix the version or remove the tag by hand."
                exit 1
              fi
              echo "$tag already exists on the remote at this commit. Skipping."
              continue
            fi
            git tag "$tag" "$GITHUB_SHA"
            git -c "http.https://github.com/.extraheader=$AUTH" push origin "refs/tags/$tag"
            echo "Tagged $tag"
          done
