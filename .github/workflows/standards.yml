name: Code Standards

# Mechanical enforcement of the repo's layering and code standards.
# These are FAILING gates, not advisory: a rule nobody has seen fail is a rule
# nobody knows is wired up.
#
# Pull requests only. The main ruleset requires both jobs and requires the branch to be up to date with main before it
# merges, so the pull request run has already checked exactly what lands; a second run on the push to main would repeat it.
# A pull request opened with GITHUB_TOKEN (enacted-update.yml) triggers no workflow, so its required checks never start:
# close and reopen it, or press "Update branch", to run them.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # dependency-cruiser needs the TypeScript compiler present or it silently
      # cruises 0 modules and passes on a completely broken graph.
      - name: Guard against a false pass
        run: |
          node -e "require.resolve('typescript')" 2>/dev/null || {
            echo "::error::typescript is not installed. dependency-cruiser will report 0 modules and pass on a broken graph. Run: npm i -D typescript"
            exit 1
          }

      - name: Layer direction and public-API rules
        run: npm run depcruise

      - name: Typecheck (server and client)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the viewer
        run: npm run build

      # Which components changed in this pull request, and did their versions move? Warns until config/release.json
      # sets enforce.
      - name: Version check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run version:check -- --base "origin/$BASE_REF"

  # Draws a few small states and compares their fingerprints with tests/fingerprints/engine.json: the map may only
  # change when the engine major version does. Passes vacuously while the base's file records no states.
  fixture-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # Full history: the gate compares against the pull request's base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: census-${{ hashFiles('config/census-sha256.json') }}

      - name: Install
        run: npm ci

      # Compared against the BASE branch's tests/fingerprints/engine.json, never the pull request's own copy.
      - name: Fixture fingerprints
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run fingerprints -- --check --base "origin/$BASE_REF"

      # The district counts in config/legislative-districts.json must match the pinned Census State House and State
      # Senate files they are counted from (the files come from the same cache as the fingerprints).
      - name: Legislative district counts
        run: npm run legislative:count -- --check
