name: Enacted districts update

# Looks for a newer enacted congressional districts file from the Census Bureau and, when there is one, opens a
# pull request that updates the comparison overlay. The checks run here, before the pull request exists, because a
# pull request opened with GITHUB_TOKEN does not trigger the other workflows. Needs the repository setting
# "Allow GitHub Actions to create and approve pull requests" (Settings > Actions > General), which is what lets a
# workflow open one. This workflow only ever opens a pull request; a person reviews and merges it.
#
# Two jobs, so that no code from a dependency ever runs holding a token that can write:
#   build    runs npm, the tests and the build with a read-only token, and hands over only the files the update may change.
#   open-pr  holds the write token and runs no npm or repository script. It treats the build job's output as untrusted
#            data: the artifact is downloaded outside the workspace, every entry is checked in plain bash (regular files
#            only, names on an exact allowlist), and only then are those files copied to their fixed places. Nothing from
#            the artifact can reach .git/ or any other path. The checkout keeps no credentials; the token is handed only
#            to the one push and the one gh call that need it.

on:
  schedule:
    - cron: '0 14 3 * *'
  workflow_dispatch:
    inputs:
      force_file:
        description: 'Skip the Census check and adopt this file instead, e.g. cb_2027_us_cd120_500k (for testing the update)'
        required: false
        default: ''

concurrency:
  group: enacted-update
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update: ${{ steps.detect.outputs.update }}
      file: ${{ steps.detect.outputs.file }}
      url: ${{ steps.detect.outputs.url }}
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Look for a newer file
        id: detect
        env:
          FORCE_FILE: ${{ inputs.force_file }}
        run: |
          set -euo pipefail
          if [ -n "$FORCE_FILE" ]; then
            result=$(npm run -s enacted:check -- --file "$FORCE_FILE")
          else
            result=$(npm run -s enacted:check)
          fi
          echo "$result"
          if [ "$(echo "$result" | jq -r '.update')" != "true" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "No newer enacted districts file. Nothing to do."
            exit 0
          fi
          file=$(echo "$result" | jq -r '.file')
          if ! [[ "$file" =~ ^cb_([0-9]{4})_us_cd([0-9]+)_500k$ ]]; then
            echo "::error::Unexpected file name: $file"
            exit 1
          fi
          {
            echo "update=true"
            echo "file=$file"
            echo "url=$(echo "$result" | jq -r '.url')"
          } >> "$GITHUB_OUTPUT"

      # A pull request for this file in any state means it was already handled; a closed one means the owner
      # turned that file down, and it stays turned down. A branch with no pull request is a failed earlier run
      # and does not block this one.
      - name: Skip if this file already has a pull request
        id: existing
        if: steps.detect.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: auto/enacted-${{ steps.detect.outputs.file }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --head "$BRANCH" --state all --json number --jq 'length')
          if [ "$prs" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A pull request for $BRANCH already exists. Nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the file and rebuild the overlay
        if: steps.detect.outputs.update == 'true' && steps.existing.outputs.skip == 'false'
        env:
          FILE: ${{ steps.detect.outputs.file }}
        run: npm run enacted:bump -- --file "$FILE"

      - name: Only the expected files changed
        id: changes
        if: steps.detect.outputs.update == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The update changed nothing. Nothing to do."
            exit 0
          fi
          unexpected=$(git status --porcelain --untracked-files=all | cut -c4- \
            | grep -Ev '^(config/(enacted|census-sha256|versions)\.json|changelog/(input|maps)\.md|public/data/(index|versions)\.json|public/data/[A-Z]{2}/(enacted\.topo|stats)\.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The update touched files it should not have:"
            echo "$unexpected"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Layer direction and public-API rules
        if: steps.changes.outputs.changed == 'true'
        run: npm run depcruise

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: npm test

      - name: Build the viewer
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      # Only the files the update may change leave this job.
      - name: Hand over the changed files
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: enacted-update
          if-no-files-found: error
          retention-days: 1
          path: |
            config/enacted.json
            config/census-sha256.json
            config/versions.json
            changelog/input.md
            changelog/maps.md
            public/data/index.json
            public/data/versions.json
            public/data/*/enacted.topo.json
            public/data/*/stats.json

  open-pr:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Outside the workspace, so nothing in it can land on .git/ or a tracked path before it has been checked.
      - uses: actions/download-artifact@v4
        with:
          name: enacted-update
          path: ${{ runner.temp }}/enacted-artifact

      - name: Check the artifact and copy in the expected files
        env:
          FILE: ${{ needs.build.outputs.file }}
          URL: ${{ needs.build.outputs.url }}
          ARTIFACT: ${{ runner.temp }}/enacted-artifact
        run: |
          set -euo pipefail
          if ! [[ "$FILE" =~ ^cb_[0-9]{4}_us_cd[0-9]+_500k$ ]]; then
            echo "::error::Unexpected file name: $FILE"
            exit 1
          fi
          if [ "$URL" != "https://www2.census.gov/geo/tiger/GENZ${FILE:3:4}/shp/${FILE}.zip" ]; then
            echo "::error::Unexpected source address: $URL"
            exit 1
          fi
          allowed='^(config/(enacted|census-sha256|versions)\.json|changelog/(input|maps)\.md|public/data/(index|versions)\.json|public/data/[A-Z]{2}/(enacted\.topo|stats)\.json)$'
          dir="$ARTIFACT"
          files=()
          while IFS= read -r -d '' entry; do
            rel="${entry#"$dir"/}"
            if [ -L "$entry" ]; then
              echo "::error::The artifact holds a symbolic link: $rel"
              exit 1
            fi
            if [ -d "$entry" ]; then
              continue
            fi
            if ! [ -f "$entry" ]; then
              echo "::error::The artifact holds something other than a directory or a regular file: $rel"
              exit 1
            fi
            if ! [[ "$rel" =~ $allowed ]]; then
              echo "::error::The artifact holds a file the update should not touch: $rel"
              exit 1
            fi
            files+=("$rel")
          done < <(find "$dir" -mindepth 1 -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::The artifact holds no files."
            exit 1
          fi
          for rel in "${files[@]}"; do
            parent=$(dirname "$rel")
            test -d "$parent" || { echo "::error::No such directory in the checkout: $parent"; exit 1; }
            cp -- "$dir/$rel" "$rel"
          done
          # A second check, on what git now sees.
          unexpected=$(git status --porcelain --untracked-files=all | cut -c4- \
            | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The copied files include ones the update should not touch:"
            echo "$unexpected"
            exit 1
          fi
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::The downloaded files change nothing."
            exit 1
          fi

      # The branch belongs to this workflow and has no pull request (the first job checked), so replacing it is safe.
      - name: Commit and push a branch
        env:
          BRANCH: auto/enacted-${{ needs.build.outputs.file }}
          FILE: ${{ needs.build.outputs.file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add config/enacted.json config/census-sha256.json config/versions.json changelog/input.md changelog/maps.md public/data
          git commit -m "chore(data): update enacted districts to $FILE" \
            -m "Rebuilds enacted.topo.json and the enactedSource in stats.json for every state, pins the new Census file in config/census-sha256.json, and bumps the input revision and maps release in config/versions.json. Display only: no generated district changes."
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force origin "$BRANCH"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: auto/enacted-${{ needs.build.outputs.file }}
          FILE: ${{ needs.build.outputs.file }}
          URL: ${{ needs.build.outputs.url }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$FILE" =~ ^cb_([0-9]{4})_us_cd([0-9]+)_500k$ ]]; then
            echo "::error::Unexpected file name: $FILE"
            exit 1
          fi
          YEAR="${BASH_REMATCH[1]}"
          CONGRESS="${BASH_REMATCH[2]}"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The Census Bureau has published a newer enacted congressional districts file. This updates the dashed comparison overlay in the viewer to it.

          - File: \`${FILE}\` (Congress ${CONGRESS}, ${YEAR} release)
          - Source: ${URL}
          - Pinned in \`config/census-sha256.json\` by its SHA-256; the entries for enacted files that are no longer used were removed.
          - \`config/enacted.json\` now names this Congress and file, and both the publisher and the viewer read it.
          - Every state's \`enacted.topo.json\` was rebuilt and its \`stats.json\` \`enactedSource\` updated. The input revision and maps release in \`config/versions.json\` moved up by one, with entries in \`changelog/input.md\` and \`changelog/maps.md\`; the version stamps in \`stats.json\` and \`index.json\` follow. No other file changed.

          The overlay is display only. It never affects how districts are drawn, and no generated district, population or statistic depends on it.

          Typecheck, the dependency rules, the tests and the build all passed in the workflow run that opened this pull request. Review the changed Census file and the overlay, then merge. This workflow never approves or merges a pull request.
          EOF
          if ! gh pr create --base "$BASE" --head "$BRANCH" --title "Update enacted districts to ${FILE}" --body-file "$RUNNER_TEMP/body.md"; then
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin --delete "$BRANCH" || true
            echo "::error::Could not open the pull request. The likely cause is that the repository setting \"Allow GitHub Actions to create and approve pull requests\" (Settings > Actions > General) is off. The branch was deleted so the next run can try again."
            exit 1
          fi
